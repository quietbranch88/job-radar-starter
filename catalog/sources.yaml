# Public job boards carried over from the private edition's company list.
# `job-radar init` copies this file to user-data/sources.yaml.
# Board values are the public Greenhouse or Ashby names. Delete a company
# you do not want, or add one with the name from its careers URL:
#   Greenhouse  boards.greenhouse.io/BOARD
#   Lever       jobs.lever.co/BOARD
#   Ashby       jobs.ashbyhq.com/BOARD
# A company listed in more than one country keeps each posting's own location.
# The scan does not relabel every role with a single country.
countries:
  TW:
    name: Taiwan
    sources: [greenhouse, lever, ashby]
  JP:
    name: Japan
    sources: [greenhouse, lever, ashby]
  SG:
    name: Singapore
    sources: [greenhouse, lever, ashby]
  CA:
    name: Canada
    sources: [greenhouse, lever, ashby]
  GB:
    name: United Kingdom
    sources: [greenhouse, lever, ashby]
  DE:
    name: Germany
    sources: [greenhouse, lever, ashby]
  FR:
    name: France
    sources: [greenhouse, lever, ashby]
  NL:
    name: Netherlands
    sources: [greenhouse, lever, ashby]
  US:
    name: United States
    sources: [greenhouse, lever, ashby]
  REMOTE:
    name: Global Remote
    sources: [greenhouse, lever, ashby]

sources:
  greenhouse:
    kind: official_api
    terms_url: https://developer.greenhouse.io/job-board.html
    enabled: true
  lever:
    kind: official_api
    terms_url: https://github.com/lever/postings-api
    enabled: true
  ashby:
    kind: official_api
    terms_url: https://developers.ashbyhq.com/docs/public-job-posting-api
    enabled: true

companies:
  Airwallex:
    countries: [SG, US]
    source: ashby
    board: airwallex
  Cohere:
    countries: [CA, US]
    source: ashby
    board: cohere
  Faire:
    countries: [US, CA]
    source: greenhouse
    board: faire
  GitLab:
    countries: [REMOTE]
    source: greenhouse
    board: gitlab
  Monzo:
    countries: [GB]
    source: greenhouse
    board: monzo
  OpenAI:
    countries: [US, SG, JP, GB]
    source: ashby
    board: openai
  PayPay:
    countries: [JP]
    source: greenhouse
    board: paypay
