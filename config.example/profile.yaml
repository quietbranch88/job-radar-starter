# Copied to user-data/profile.yaml by `job-radar init`.
# Change the lists below. This file is preferences only.
# Built-in commands do not open resume_path.
profile:
  resume_path: user-data/resume.md
  skills:
    - Go
    - Python
    - PostgreSQL

preferences:
  countries:
    - CA
    - REMOTE
  roles:
    - backend
    - platform
  tracks:
    - ai-product
    - backend
  visa_required: true

companies:
  preferred:
    - Your preferred company
  excluded:
    - A company you do not want to see

matching:
  # The scanner or AI controller may use these local-only rules when it
  # produces normalized jobs JSON. The dashboard displays the resulting score.
  minimum_score: 65
  must_have:
    - backend
  exclude_keywords:
    - unpaid
    - commission-only
  # Optional local point values. Omit the block to keep these defaults.
  # Weights stay in this file and are not sent to a review provider.
  weights:
    base: 30
    country: 10
    role: 15
    track: 10
    skill: 8
    skill_cap: 24
    preferred_company: 10
    must_have: 5
    missing_must_have: 20
    visa_listed: 5
    visa_absent: 25
    visa_unknown: 8
